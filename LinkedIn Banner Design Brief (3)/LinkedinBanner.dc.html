<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="LinkedIn Banner" description="1584×396 LinkedIn company-page cover banner" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:1584px;height:396px;position:relative;overflow:hidden;background:var(--keenai-deep-navy, #011526);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="position:absolute;left:920px;top:-260px;width:920px;height:920px;border-radius:50%;background:radial-gradient(circle at 35% 35%, rgba(234,79,5,0.55), rgba(234,79,5,0.07) 60%, transparent 75%);"></div>

  <img src="assets/keenai-wordmark-white.svg" alt="Keenai" style="position:absolute;left:64px;top:56px;width:170px;height:auto;">

  <div style="position:absolute;left:64px;top:150px;width:820px;">
    <div style="font-weight:500;font-size:52px;line-height:1.05;letter-spacing:-0.03em;color:#FFFFFF;text-wrap:pretty;">{{ headline }}</div>
    <sc-if value="{{ subhead }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:16px;font-weight:400;font-size:20px;line-height:1.4;letter-spacing:-0.011em;color:rgba(255,255,255,0.72);max-width:640px;">{{ subhead }}</div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:792,&quot;height&quot;:198},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The long view. Tech-led private wealth.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subhead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;In partnership with Lighthouse Canton.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      headline: this.props.headline ?? 'The long view. Tech-led private wealth.',
      subhead: this.props.subhead ?? 'In partnership with Lighthouse Canton.',
    };
  }
}

</script>
</body>
</html>
